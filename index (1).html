<title>The Long Play</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Long Play">
<meta name="theme-color" content="#0E1820">
<style>html,body{margin:0;background:#0E1820;min-height:100%}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --ink:#0E1820;
    --surface:#16242E;
    --raise:#1E313D;
    --line:rgba(232,228,218,.10);
    --line2:rgba(232,228,218,.18);
    --bone:#E9E5DB;
    --mute:#8B9DA9;
    --brass:#E0AC5E;
    --loved:#71C0A0;
    --passed:#C0757A;
    --r:14px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #lp{
    font-family:var(--sans);
    color:var(--bone);
    background:var(--ink);
    background-image:radial-gradient(120% 60% at 50% -10%, rgba(224,172,94,.09), transparent 60%);
    border-radius:var(--r);
    overflow:hidden;
    max-width:780px;
    margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  #lp button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  #lp button:focus-visible,#lp input:focus-visible,#lp select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* header */
  .hd{padding:16px 18px 0}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .brand h1{
    margin:0;font-family:var(--mono);font-size:11px;font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;color:var(--brass);
  }
  .brand .cnt{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.06em}
  .meter{height:2px;background:var(--line);margin:12px 0 0;border-radius:2px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--brass);width:0;transition:width .5s ease}

  /* tabs */
  .tabs{display:flex;gap:2px;padding:14px 18px 0}
  .tabs button{
    flex:1;padding:9px 4px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mute);border-bottom:1.5px solid transparent;transition:.18s;
  }
  .tabs button[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--brass)}

  .body{padding:18px}
  .pane{display:none}
  .pane.on{display:block;animation:fade .28s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .modebar{
    font-size:12.5px;line-height:1.5;color:var(--mute);background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--brass);
    padding:10px 13px;border-radius:0 8px 8px 0;margin:0 0 16px;
  }
  .modebar b{color:var(--bone);font-weight:600}
  .modebar.memory{border-left-color:var(--passed);background:#251A1C}
  .modebar.memory b{color:#E7B2B6}

  .modebar.ok{border-left-color:var(--loved)}
  .codewrap{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px}
  .codebox{
    font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--brass);
    background:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:11px 12px;
    word-break:break-all;user-select:all;-webkit-user-select:all;max-height:96px;overflow:auto;
  }
  .codeacts{display:flex;gap:8px;margin-top:10px}
  .codeacts button{
    flex:1;padding:11px;border:1px solid var(--line2);border-radius:9px;
    font-size:12.5px;color:var(--bone);background:var(--raise);
  }
  .codenote{font-size:11.5px;color:var(--mute);line-height:1.5;margin:11px 0 0}

  /* now card */
  .now{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:20px 20px 20px 22px;overflow:hidden;
  }
  .now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
  .catno{
    font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--brass);
    text-transform:uppercase;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .catno .of{color:var(--mute);letter-spacing:.1em}
  .rankbig{
    font-family:var(--mono);font-size:44px;font-weight:600;line-height:.9;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;margin:0 0 14px;
  }
  .ttl{font-size:23px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px}
  .art{font-size:15px;color:var(--mute);margin:0 0 16px;line-height:1.35}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 9px;border:1px solid var(--line2);border-radius:99px;color:var(--mute);
  }
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .acts button{
    padding:14px 8px;border-radius:10px;border:1px solid var(--line2);
    font-size:14px;font-weight:600;transition:.15s;background:var(--raise);
  }
  .acts button:active{transform:scale(.97)}
  .bLove{color:var(--loved);border-color:rgba(113,192,160,.4)}
  .bPass{color:var(--passed);border-color:rgba(192,117,122,.4)}
  .subacts{display:flex;gap:14px;margin-top:14px;justify-content:center;flex-wrap:wrap}
  .subacts button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:6px}
  .subacts button:hover{color:var(--bone)}

  .upnext{margin-top:22px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}

  /* rows */
  .row{
    display:flex;gap:13px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none}
  .rk{
    font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;
    min-width:44px;padding-top:2px;letter-spacing:.02em;
  }
  .rowmain{flex:1;min-width:0}
  .rowT{font-size:14.5px;font-weight:600;line-height:1.3;margin:0 0 2px}
  .rowA{font-size:12.5px;color:var(--mute);margin:0;line-height:1.3}
  .mark{font-family:var(--mono);font-size:13px;padding-top:2px;min-width:18px;text-align:right}
  .mark.l{color:var(--loved)}
  .mark.p{color:var(--passed)}
  .row.done .rowT{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
  .row.done .rowA{opacity:.55}
  .rowbtn{display:flex;gap:6px;padding-top:1px}
  .rowbtn button{font-size:15px;line-height:1;padding:5px 6px;border-radius:7px;border:1px solid var(--line);color:var(--mute)}
  .rowbtn button.on-l{color:var(--loved);border-color:rgba(113,192,160,.45)}
  .rowbtn button.on-p{color:var(--passed);border-color:rgba(192,117,122,.45)}

  /* controls */
  .ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .ctrl input,.ctrl select{
    background:var(--surface);border:1px solid var(--line2);color:var(--bone);
    padding:10px 11px;border-radius:9px;font-size:14px;font-family:var(--sans);
  }
  .ctrl input{flex:1;min-width:140px}
  .ctrl select{font-size:12.5px}
  .more{width:100%;margin-top:16px;padding:13px;border:1px dashed var(--line2);border-radius:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

  /* stats */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px}
  .stat b{display:block;font-family:var(--mono);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-top:5px}
  .bars{margin-bottom:20px}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
  .bar .bn{width:88px;color:var(--mute);font-size:11.5px;flex-shrink:0}
  .bar .bt{flex:1;height:5px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .bt i{display:block;height:100%;background:var(--brass);opacity:.75}
  .bar .bv{font-family:var(--mono);font-size:10.5px;color:var(--mute);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
  .datax{display:flex;gap:8px;flex-wrap:wrap}
  .datax button{padding:11px 14px;border:1px solid var(--line2);border-radius:9px;font-size:12.5px;color:var(--mute)}
  .note{font-size:12px;color:var(--mute);line-height:1.55;margin-top:16px}
  .empty{text-align:center;padding:36px 16px;color:var(--mute);font-size:14px;line-height:1.6}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(70px);
    background:var(--raise);border:1px solid var(--line2);color:var(--bone);
    padding:11px 17px;border-radius:99px;font-size:13px;z-index:99;opacity:0;
    transition:.28s cubic-bezier(.2,.9,.3,1);pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.45);
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:420px){.rankbig{font-size:38px}.ttl{font-size:20px}}
</style>

<div id="lp">
  <div class="hd">
    <div class="brand">
      <h1>The Long Play</h1>
      <div class="cnt" id="hcount">—</div>
    </div>
    <div class="meter"><i id="hbar"></i></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-p="now">Up next</button>
    <button role="tab" aria-selected="false" data-p="list">The list</button>
    <button role="tab" aria-selected="false" data-p="stats">Progress</button>
  </div>
  <div class="body">
    <div class="modebar" id="mode">Checking where your progress is being saved\u2026</div>
    <div class="pane on" id="p-now"></div>
    <div class="pane" id="p-list"></div>
    <div class="pane" id="p-stats"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const N = CAT.length;
const KEY = 'longplay-v1';
// Progress already confirmed in chat, applied on first run if nothing is stored yet.
const SEED = 'LP-z1y8z-z1y9za-';
// rank = index+1 (1 = most acclaimed). Countdown runs N -> 1.
const rankOf = i => i + 1;
const idxOfRank = r => r - 1;

let S = { st:{}, def:{}, started:null, history:[], ts:0 };
let MODE = 'checking', MEM = {};

/* ---- storage: write to EVERY available store, read whichever copy is newest ---- */
async function waitForHost(){
  for(let i=0;i<12;i++){
    if(window.storage && window.storage.get) return true;
    await new Promise(r=>setTimeout(r,50));
  }
  return false;
}
async function readAll(k){
  const found = [];
  if(window.storage && window.storage.get){
    try{ const r = await window.storage.get(k); if(r && r.value){ found.push(['artifact', r.value]); } else found.push(['artifact', null]); }
    catch(e){ found.push(['artifact', null]); }
  }
  try{ const v = localStorage.getItem(k); found.push(['local', v]); }catch(e){}
  try{ const v = sessionStorage.getItem(k); found.push(['session', v]); }catch(e){}
  if(MEM[k]) found.push(['memory', MEM[k]]);
  return found;
}
async function writeAll(k,v){
  let anywhere = false, best = null;
  if(window.storage && window.storage.set){
    try{ await window.storage.set(k,v); anywhere = true; best = 'artifact'; }catch(e){}
  }
  try{ localStorage.setItem(k,v); anywhere = true; best = best || 'local'; }catch(e){}
  try{ sessionStorage.setItem(k,v); anywhere = true; best = best || 'session'; }catch(e){}
  MEM[k] = v;
  MODE = anywhere ? best : 'memory';
  return anywhere;
}

async function load(){
  await waitForHost();
  const copies = await readAll(KEY);
  let best = null, bestTs = -1, anyStore = false;
  for(const [where, raw] of copies){
    if(where !== 'memory') anyStore = true;
    if(!raw) continue;
    try{
      const v = JSON.parse(raw);
      const ts = v.ts || 0;
      if(ts >= bestTs){ bestTs = ts; best = v; MODE = where; }
    }catch(e){}
  }
  if(best){ S = Object.assign(S, best); S.st = S.st||{}; S.def = S.def||{}; }
  else{
    MODE = anyStore ? (copies[0] ? copies[0][0] : 'memory') : 'memory';
    if(SEED){ try{ applyCode(SEED); }catch(e){} }   // first run: start from known progress
  }
}

/* saves immediately — no delay, nothing to lose if the app closes */
function save(){
  S.ts = Date.now();
  writeAll(KEY, JSON.stringify(S)).then(()=>{ showMode(); paintCode(); });
  paintCode();
}
function showMode(){
  const n = document.getElementById('mode');
  if(!n) return;
  if(MODE==='memory') n.innerHTML = '<b>Not saving on its own here.</b> Copy your progress code below before you close this — that always works.';
  else n.innerHTML = '<b>Saving automatically</b> — and your progress code below is the backup if it ever doesn’t.';
  n.className = 'modebar ' + (MODE==='memory' ? 'memory' : 'ok');
}

/* ---- progress code: short, pasteable, works no matter what storage does ---- */
function encRanks(list){
  list = list.slice().sort((a,b)=>a-b);
  let out = '', prev = 0;
  for(const r of list){
    const d = r - prev; prev = r;
    if(d >= 1 && d <= 25) out += String.fromCharCode(96 + d);
    else out += 'z' + d.toString(36) + 'z';
  }
  return out;
}
function decRanks(str){
  const out = []; let prev = 0, i = 0;
  while(i < str.length){
    const c = str[i];
    if(c === 'z'){
      const j = str.indexOf('z', i+1); if(j < 0) break;
      prev += parseInt(str.slice(i+1, j), 36); i = j + 1;
    } else { prev += c.charCodeAt(0) - 96; i++; }
    out.push(prev);
  }
  return out;
}
function makeCode(){
  const L = [], P = [], D = [];
  for(const k in S.st){ (S.st[k]==='l' ? L : P).push(+k); }
  for(const k in S.def){ D.push(+k); }
  return 'LP-' + encRanks(L) + '-' + encRanks(P) + '-' + encRanks(D);
}
function applyCode(code){
  code = String(code).trim();
  if(code.charAt(0) === '{'){                 // older JSON backup still works
    const v = JSON.parse(code);
    if(!v || typeof v.st !== 'object') throw 0;
    S = Object.assign({st:{},def:{},started:null,history:[],ts:0}, v);
    return;
  }
  if(code.slice(0,3).toUpperCase() !== 'LP-') throw 0;
  const parts = code.slice(3).split('-');
  const st = {}, def = {};
  decRanks(parts[0]||'').forEach(r=>{ if(r>=1&&r<=N) st[r]='l'; });
  decRanks(parts[1]||'').forEach(r=>{ if(r>=1&&r<=N) st[r]='p'; });
  decRanks(parts[2]||'').forEach(r=>{ if(r>=1&&r<=N) def[r]=1; });
  S = {st, def, started:S.started||Date.now(), history:[], ts:Date.now()};
}
function paintCode(){
  document.querySelectorAll('.codebox').forEach(n=>{ n.textContent = makeCode(); });
}

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2200);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(4,'0');

function heardCount(){ return Object.keys(S.st).length; }

// The queue: unplayed ranks, counting DOWN from N. Deferred ones sink to the end.
function queue(){
  const out = [];
  for(let r = N; r >= 1; r--){ if(!S.st[r] && !S.def[r]) out.push(r); }
  for(let r = N; r >= 1; r--){ if(!S.st[r] && S.def[r]) out.push(r); }
  return out;
}

function mark(rank, v){
  if(!S.started) S.started = Date.now();
  S.history.push({r:rank, prev:S.st[rank]||null, pd:!!S.def[rank]});
  if(S.history.length > 60) S.history.shift();
  S.st[rank] = v; delete S.def[rank];
  save(); render();
}
function defer(rank){
  S.history.push({r:rank, prev:S.st[rank]||null, pd:!!S.def[rank]});
  S.def[rank] = 1; delete S.st[rank];
  save(); render();
  toast('Moved to the back of the queue.');
}
function undo(){
  const h = S.history.pop();
  if(!h){ toast('Nothing to undo.'); return; }
  if(h.prev) S.st[h.r] = h.prev; else delete S.st[h.r];
  if(h.pd) S.def[h.r] = 1; else delete S.def[h.r];
  save(); render(); toast('Undone.');
}

  }

  }).join('');

  el.innerHTML = `
    <div class="now">

      <h2 class="ttl">${esc(a[1])}</h2>
      <p class="art">${esc(a[0])}</p>
      <div class="tags"><span class="tag">${esc(a[3])}</span><span class="tag">${a[2]}</span>${S.def[r]?'<span class="tag">Returned</span>':''}</div>
      <div class="acts">
        <button class="bLove" data-act="l">&#9650;&nbsp; Loved it</button>
        <button class="bPass" data-act="p">&#9660;&nbsp; Not for me</button>
      </div>
      <div class="subacts">
        <button data-act="d">Not tonight</button>
        <button data-act="u">Undo last</button>
      </div>
    </div>
    <div class="codewrap">
      <p class="lbl">Your progress code</p>
      <div class="codebox"></div>
      <div class="codeacts">
        <button data-act="c">Copy code</button>
        <button data-act="r">Restore from code</button>
      </div>
      <p class="codenote">Updates every time you rate an album. Paste it into the chat and it’s saved permanently — that works even if this app forgets.</p>
    </div>
    <div class="upnext">
      <p class="lbl">Then</p>
      ${nextUp || '<div class="empty">That was the last one queued.</div>'}
    </div>`;

  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const k = b.dataset.act;
    if(k==='l'){ mark(r,'l'); toast('Marked loved. On to No. '+pad(q[1]||r)+'.'); }
    else if(k==='p'){ mark(r,'p'); toast('Crossed off. On to No. '+pad(q[1]||r)+'.'); }
    else if(k==='d') defer(r);
    else if(k==='u') undo();
    else if(k==='c') copyCode();
    else if(k==='r') restoreCode();
  });
  paintCode();
}

async function copyCode(){
  const c = makeCode();
  try{ await navigator.clipboard.writeText(c); toast('Code copied. Paste it into the chat.'); }
  catch(e){ prompt('Copy this code and paste it into the chat:', c); }
}
function restoreCode(){
  const t = prompt('Paste a progress code:');
  if(!t) return;
  try{ applyCode(t); save(); render(); toast('Progress restored.'); }
  catch(e){ toast('That code couldn\u2019t be read.'); }
}

/* ---------- The list ---------- */
let LQ='', LG='all', LS='all', LIM=80;
function renderList(){
  const el = document.getElementById('p-list');
  const genres = [...new Set(CAT.map(a=>a[3]))].sort();
  const q = LQ.trim().toLowerCase();
  const rows = [];
  for(let r = N; r >= 1; r--){
    const a = CAT[idxOfRank(r)], st = S.st[r];
    if(LG!=='all' && a[3]!==LG) continue;
    if(LS==='todo' && st) continue;
    if(LS==='loved' && st!=='l') continue;
    if(LS==='passed' && st!=='p') continue;
    if(LS==='heard' && !st) continue;
    if(q && !(a[0].toLowerCase().includes(q) || a[1].toLowerCase().includes(q) || String(a[2]).includes(q))) continue;
    rows.push(r);
  }
  const shown = rows.slice(0, LIM);
  const html = shown.map(r=>{
    const a = CAT[idxOfRank(r)], st = S.st[r];
    return `<div class="row ${st?'done':''}">
      <div class="rk">${pad(r)}</div>
      <div class="rowmain"><p class="rowT">${esc(a[1])}</p><p class="rowA">${esc(a[0])} &middot; ${a[2]} &middot; ${esc(a[3])}</p></div>
      <div class="rowbtn">
        <button data-r="${r}" data-v="l" class="${st==='l'?'on-l':''}" aria-label="Loved">&#9650;</button>
        <button data-r="${r}" data-v="p" class="${st==='p'?'on-p':''}" aria-label="Not for me">&#9660;</button>
      </div></div>`;
  }).join('');

  el.innerHTML = `
    <div class="ctrl">
      <input id="lq" placeholder="Search artist, album, year" value="${esc(LQ)}">
      <select id="lg">${['all',...genres].map(g=>`<option value="${esc(g)}" ${g===LG?'selected':''}>${g==='all'?'All genres':esc(g)}</option>`).join('')}</select>
      <select id="ls">${[['all','All'],['todo','Not yet heard'],['heard','Heard'],['loved','Loved'],['passed','Not for me']].map(([v,t])=>`<option value="${v}" ${v===LS?'selected':''}>${t}</option>`).join('')}</select>
    </div>
    <p class="lbl">${rows.length} album${rows.length===1?'':'s'}</p>
    ${html || '<div class="empty">Nothing matches that. Try a looser search.</div>'}
    ${rows.length > LIM ? `<button class="more" id="lm">Show 80 more</button>` : ''}`;

  const qi = el.querySelector('#lq');
  qi.oninput = e => { LQ = e.target.value; LIM = 80; renderList();
    const n = document.querySelector('#lq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelector('#lg').onchange = e => { LG = e.target.value; LIM = 80; renderList(); };
  el.querySelector('#ls').onchange = e => { LS = e.target.value; LIM = 80; renderList(); };
  const lm = el.querySelector('#lm'); if(lm) lm.onclick = () => { LIM += 80; renderList(); };
  el.querySelectorAll('.rowbtn button').forEach(b => b.onclick = () => {
    const r = +b.dataset.r, v = b.dataset.v;
    if(S.st[r] === v){ S.history.push({r, prev:v, pd:false}); delete S.st[r]; save(); render(); }
    else mark(r, v);
  });
}

/* ---------- Progress ---------- */
function renderStats(){
  const el = document.getElementById('p-stats');
  const done = heardCount();
  let loved=0, passed=0;
  for(const k in S.st){ S.st[k]==='l' ? loved++ : passed++; }
  const pct = (done/N*100);

  const days = S.started ? Math.max(1, Math.round((Date.now()-S.started)/86400000)) : 0;
  const rate = days && done ? done/days : 0;
  let eta = '\u2014';
  if(rate > 0){
    const d = Math.ceil((N-done)/rate);
    eta = d > 730 ? (d/365).toFixed(1)+' yrs' : d > 60 ? Math.round(d/30)+' mo' : d+' days';
  }

  const byG = {};
  CAT.forEach((a,i)=>{ const g=a[3]; byG[g]=byG[g]||{t:0,d:0}; byG[g].t++; if(S.st[rankOf(i)]) byG[g].d++; });
  const bars = Object.entries(byG).sort((a,b)=>b[1].t-a[1].t).map(([g,v])=>
    `<div class="bar"><span class="bn">${esc(g)}</span><span class="bt"><i style="width:${v.d/v.t*100}%"></i></span><span class="bv">${v.d}/${v.t}</span></div>`).join('');

  el.innerHTML = `
    <div class="grid">
      <div class="stat"><b>${done}</b><span>Albums heard</span></div>
      <div class="stat"><b>${pct.toFixed(1)}%</b><span>Of the list</span></div>
      <div class="stat"><b style="color:var(--loved)">${loved}</b><span>Loved</span></div>
      <div class="stat"><b style="color:var(--passed)">${passed}</b><span>Not for me</span></div>
      <div class="stat"><b>${days||'\u2014'}</b><span>Days in</span></div>
      <div class="stat"><b style="font-size:22px">${eta}</b><span>Left at this pace</span></div>
    </div>
    <p class="lbl">By genre</p>
    <div class="bars">${bars}</div>
    <p class="lbl">Your progress code</p>
    <div class="codebox"></div>
    <div class="datax">
      <button id="ex">Copy code</button>
      <button id="im">Restore from code</button>
      <button id="rs">Reset everything</button>
    </div>
    <p class="note">This code is the whole of your progress in one line. Paste it into the chat whenever you finish a session and it is saved for good \u2014 no storage required, and it survives switching phones, browsers, or conversations.</p>`;

  el.querySelector('#ex').onclick = copyCode;
  el.querySelector('#im').onclick = restoreCode;
  el.querySelector('#rs').onclick = () => {
    if(!confirm('Clear all ratings and start again at No. '+N+'? This cannot be undone.')) return;
    S = {st:{},def:{},started:null,history:[],ts:Date.now()};
    save(); render(); toast('Back to the start.');
  };
  paintCode();
}

function render(){
  const done = heardCount();
  document.getElementById('hcount').textContent = done + ' / ' + N;
  document.getElementById('hbar').style.width = (done/N*100) + '%';
  renderNow(); renderList(); renderStats();
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-'+b.dataset.p));
});

(async () => { await load(); render(); showMode(); })();
</script>
